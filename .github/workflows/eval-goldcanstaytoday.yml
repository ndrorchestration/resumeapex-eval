name: Goldcanstaytoday Eval Scaffold

on:
  schedule:
    - cron: "0 0 * * 0"  # Weekly on Sunday
  workflow_dispatch:

jobs:
  scaffold-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile evaluation scaffold
        run: python -m compileall -q eval
      - name: Report epistemic boundary
        run: |
          echo "Goldcanstaytoday evaluator is a scaffold; this workflow verifies code integrity only."
          echo "A successful workflow run is not a benchmark result or scientific validation."
