name: Goldcanstaytoday Harness

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile evaluator
        run: python -m compileall -q eval
      - name: Run unit tests
        run: python -m pytest -q
      - name: Run deterministic known-answer fixture
        run: python -m eval.cli --data datasets/fixture_v1.json --runs 2 --seed 20260902 --bootstrap-resamples 1000 --verify-expected --output runlogs/fixture-verification.json
      - name: Repeat fixture run for reproducibility
        run: python -m eval.cli --data datasets/fixture_v1.json --runs 2 --seed 20260902 --bootstrap-resamples 1000 --verify-expected --output runlogs/fixture-verification-repeat.json
      - name: Compare deterministic outputs
        run: diff -u runlogs/fixture-verification.json runlogs/fixture-verification-repeat.json
      - name: Publish fixture artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goldcanstaytoday-harness-verification
          path: runlogs/fixture-verification*.json
      - name: Report epistemic boundary
        run: |
          echo "Harness verification establishes evaluator/fixture reproducibility only."
          echo "It is not model performance, benchmark validation, certification, or production-readiness evidence."
